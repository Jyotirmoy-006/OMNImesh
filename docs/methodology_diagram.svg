      </text>

      <!-- Bullet 3 -->
      <circle cx="12" cy="655" r="8" fill="#004080" />
      <text x="32" y="664" font-family="'Inter', sans-serif" font-size="21" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Instantly switches to threat mode.
      </text>
    </g>

    <!-- Bottom KPI Card -->
    <rect x="545" y="760" width="365" height="135" rx="10" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="728" y="838" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#004080">
      In-Development Policy
    </text>
  </g>

  <!-- ==================== CARD 3: ZSPF FAILOVER (X=990, Width=415, Center X=1198) ==================== -->
  <g id="card-stage-3">
    <rect x="990" y="165" width="415" height="790" rx="12" fill="#F8FAFC" stroke="#006633" stroke-width="2" />

