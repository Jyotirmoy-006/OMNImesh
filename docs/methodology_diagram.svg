    <!-- Massive Single-Line Bullet Points -->
    <g transform="translate(1008, 0)">
      <!-- Bullet 1 -->
      <circle cx="12" cy="415" r="8" fill="#006633" />
      <text x="32" y="424" font-family="'Inter', sans-serif" font-size="21.5" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Mode 0: Perfect cloud operation.
      </text>

      <!-- Bullet 2 -->
      <circle cx="12" cy="535" r="8" fill="#006633" />
      <text x="32" y="544" font-family="'Inter', sans-serif" font-size="21.5" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Mode 1: Autonomous P2P fallback.
      </text>

      <!-- Bullet 3 -->
      <circle cx="12" cy="655" r="8" fill="#006633" />
      <text x="32" y="664" font-family="'Inter', sans-serif" font-size="21.5" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Mode 2: Solo math-based survival.
      </text>
    </g>

    <!-- Bottom KPI Card -->
    <rect x="1015" y="760" width="365" height="135" rx="10" fill="#FFFFFF" stroke="#006633" stroke-width="2" />
    <text x="1198" y="838" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#006633">
      Resilience Validation
    </text>
  </g>

  <!-- ==================== CARD 4: HITL VALIDATION (X=1460, Width=415, Center X=1668) ==================== -->
  <g id="card-stage-4">
    <rect x="1460" y="165" width="415" height="790" rx="12" fill="#F8FAFC" stroke="#004080" stroke-width="2" />

