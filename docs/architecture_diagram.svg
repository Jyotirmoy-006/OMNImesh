<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure White Academic Background -->
  <rect width="1920" height="1080" fill="#FFFFFF" />

  <!-- Outer Academic Framing -->
  <rect x="20" y="20" width="1880" height="1040" fill="none" stroke="#CBD5E1" stroke-width="2" rx="8" />

  <!-- Marker Definitions for Enlarged Directional Arrows -->
  <defs>
    <marker id="arrow-blue-large" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#004080" />
    </marker>
    <marker id="arrow-green-large-rev" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 11 2 L 2 6 L 11 10 z" fill="#006633" />
    </marker>
    <marker id="arrow-crimson-large-rev" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 11 2 L 2 6 L 11 10 z" fill="#990000" />
    </marker>
  </defs>

  <!-- ==================== HEADER SECTION (MIN 64px TITLE) ==================== -->
  <g id="header-section">
    <text x="960" y="80" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="800" fill="#004080" letter-spacing="-0.5">
      OMNI-MESH SYSTEM ARCHITECTURE
    </text>
    <text x="960" y="124" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="26" font-weight="600" fill="#4A5568">
      Three-Tier Decentralized Edge Architecture &amp; Real-Time Data Flow Overview
    </text>
    <line x1="50" y1="148" x2="1870" y2="148" stroke="#CBD5E1" stroke-width="2.5" />
  </g>

  <!-- ==================== DATA-FLOW ARROWS (SCALED UP, 6px STROKES) ==================== -->
  <!-- Gap 1: Edge Mesh <-> MQTT Comm Bus (X=594 to X=688, Width=94px) -->
  <g id="connector-edge-bus">
    <!-- Top Flow: States (Edge -> Bus) -->
    <path d="M 598 460 L 682 460" stroke="#004080" stroke-width="6" marker-end="url(#arrow-blue-large)" />
    <rect x="600" y="405" width="82" height="44" rx="8" fill="#FFFFFF" stroke="#004080" stroke-width="2.5" />
    <text x="641" y="433" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#004080">
      States ▶
    </text>

    <!-- Bottom Flow: Sync / Directives (Bus -> Edge) -->
    <path d="M 684 645 L 600 645" stroke="#006633" stroke-width="6" marker-end="url(#arrow-green-large-rev)" />
    <rect x="600" y="660" width="82" height="44" rx="8" fill="#FFFFFF" stroke="#006633" stroke-width="2.5" />
    <text x="641" y="688" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#006633">
      ◀ Sync
    </text>
  </g>

  <!-- Gap 2: MQTT Comm Bus <-> Global Orchestrator (X=1232 to X=1326, Width=94px) -->
  <g id="connector-bus-orch">
    <!-- Top Flow: Alerts (Bus -> Orchestrator) -->
    <path d="M 1236 460 L 1320 460" stroke="#004080" stroke-width="6" marker-end="url(#arrow-blue-large)" />
    <rect x="1238" y="405" width="82" height="44" rx="8" fill="#FFFFFF" stroke="#004080" stroke-width="2.5" />
    <text x="1279" y="433" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#004080">
      Alerts ▶
    </text>

    <!-- Bottom Flow: Overrides (Orchestrator -> Bus) -->
    <path d="M 1322 645 L 1238 645" stroke="#990000" stroke-width="6" marker-end="url(#arrow-crimson-large-rev)" />
    <rect x="1236" y="660" width="86" height="44" rx="8" fill="#FFFFFF" stroke="#990000" stroke-width="2.5" />
    <text x="1279" y="688" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#990000">
      ◀ Gate
    </text>
  </g>

  <!-- ==================== CARD 1: TIER 1 EDGE MESH (544px WIDE = 28.3% CANVAS) ==================== -->
  <g id="card-edge-mesh">
    <!-- Solid Crisp 2.5px Border, 544px Wide Container -->
    <rect x="50" y="170" width="544" height="755" rx="14" fill="#F8FAFC" stroke="#004080" stroke-width="2.5" />

    <!-- Top Category Banner -->
    <rect x="75" y="195" width="494" height="42" rx="8" fill="#004080" />
    <text x="322" y="224" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="2">
      TIER 1 : DISTRIBUTED EDGE MESH
    </text>

    <!-- Header Title (Min 48px, Bold) -->
    <text x="78" y="295" font-family="'Inter', sans-serif" font-size="50" font-weight="800" fill="#1A1A1A">
      Edge Mesh
    </text>
    <text x="78" y="332" font-family="'Inter', sans-serif" font-size="24" font-weight="600" fill="#004080">
      Raspberry Pi 4B Intersection Cluster
    </text>

    <line x1="78" y1="355" x2="566" y2="355" stroke="#CBD5E1" stroke-width="2" />

    <!-- Feature List (Bullets >= 32px, Subtext >= 24px) -->
    <g transform="translate(78, 375)">
      <circle cx="8" cy="10" r="6" fill="#004080" />
      <text x="28" y="18" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#1A1A1A">
        Decentralized RL Control
      </text>
      <text x="28" y="46" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#4A5568">
        112-D PPO Actor-Critic Edge Policy
      </text>

      <circle cx="8" cy="98" r="6" fill="#004080" />
      <text x="28" y="106" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#1A1A1A">
        Edge Vision &amp; ANPR
      </text>
      <text x="28" y="134" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#4A5568">
        YOLOv8n INT8 with Thermal Dropout
      </text>

      <circle cx="8" cy="186" r="6" fill="#004080" />
      <text x="28" y="194" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#1A1A1A">
        P2P Mesh Protocol
      </text>
      <text x="28" y="222" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#4A5568">
        Autonomous Neighbor State Exchange
      </text>

      <circle cx="8" cy="274" r="6" fill="#004080" />
      <text x="28" y="282" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#1A1A1A">
        ZSPF Island Fallback
      </text>
      <text x="28" y="310" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#4A5568">
        Independent Mode 2 Max-Pressure Floor
      </text>
    </g>

    <!-- Bottom KPI Card -->
    <rect x="78" y="745" width="488" height="100" rx="10" fill="#FFFFFF" stroke="#004080" stroke-width="2.5" />
    <text x="322" y="788" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="#004080">
      Sub-100ms Control
    </text>
    <text x="322" y="824" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24" font-weight="600" fill="#1A1A1A">
      Deterministic Real-Time Execution
    </text>

    <!-- Technical Specification Pill -->
    <rect x="78" y="860" width="488" height="44" rx="8" fill="#EDF2F7" />
    <text x="322" y="889" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#2D3748">
      RPi 4B (4GB) • INT8 NCNN • Mode 0/1/2 Support
    </text>
  </g>

  <!-- ==================== CARD 2: MIDDLEWARE MQTT COMM BUS (544px WIDE) ==================== -->
  <g id="card-mqtt-bus">
    <!-- Solid Crisp 2.5px Border in Emerald Green -->
    <rect x="688" y="170" width="544" height="755" rx="14" fill="#F8FAFC" stroke="#006633" stroke-width="2.5" />

    <!-- Top Category Banner -->
    <rect x="713" y="195" width="494" height="42" rx="8" fill="#006633" />
    <text x="960" y="224" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="2">
