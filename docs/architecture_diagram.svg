<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure White Academic Background -->
  <rect width="1920" height="1080" fill="#FFFFFF" />

  <!-- Outer Academic Framing -->
  <rect x="20" y="20" width="1880" height="1040" fill="none" stroke="#CBD5E1" stroke-width="2" rx="8" />

  <!-- Marker Definitions for Enlarged Directional Arrows -->
  <defs>
    <marker id="arrow-blue-large" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#004080" />
    </marker>
    <marker id="arrow-green-large-rev" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 11 2 L 2 6 L 11 10 z" fill="#006633" />
    </marker>
    <marker id="arrow-crimson-large-rev" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 11 2 L 2 6 L 11 10 z" fill="#990000" />
    </marker>
  </defs>

  <!-- ==================== HEADER SECTION ==================== -->
  <g id="header-section">
    <text x="960" y="75" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="800" fill="#004080" letter-spacing="-0.5">
      OMNI-MESH SYSTEM ARCHITECTURE
    </text>
    <text x="960" y="118" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="600" fill="#4A5568">
      Three-Tier Decentralized Edge Architecture &amp; Real-Time Data Flow
    </text>
    <line x1="50" y1="145" x2="1870" y2="145" stroke="#CBD5E1" stroke-width="2" />
  </g>

  <!-- ==================== DATA-FLOW ARROWS (SCALED 5px STROKES) ==================== -->
  <!-- Gap 1: Edge Mesh <-> MQTT Comm Bus (X=594 to X=688, Center X=641) -->
  <g id="connector-edge-bus">
    <!-- Top Flow: States (Edge -> Bus) -->
    <path d="M 598 475 L 682 475" stroke="#004080" stroke-width="5" marker-end="url(#arrow-blue-large)" />
    <rect x="599" y="420" width="84" height="42" rx="6" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="641" y="447" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#004080">
      States ▶
    </text>

    <!-- Bottom Flow: Sync / Directives (Bus -> Edge) -->
    <path d="M 684 665 L 600 665" stroke="#006633" stroke-width="5" marker-end="url(#arrow-green-large-rev)" />
    <rect x="599" y="680" width="84" height="42" rx="6" fill="#FFFFFF" stroke="#006633" stroke-width="2" />
    <text x="641" y="707" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#006633">
      ◀ Sync
    </text>
  </g>

  <!-- Gap 2: MQTT Comm Bus <-> Global Orchestrator (X=1232 to X=1326, Center X=1279) -->
  <g id="connector-bus-orch">
    <!-- Top Flow: Alerts (Bus -> Orchestrator) -->
    <path d="M 1236 475 L 1320 475" stroke="#004080" stroke-width="5" marker-end="url(#arrow-blue-large)" />
    <rect x="1237" y="420" width="84" height="42" rx="6" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="1279" y="447" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#004080">
      Alerts ▶
    </text>

    <!-- Bottom Flow: Overrides (Orchestrator -> Bus) -->
    <path d="M 1322 665 L 1238 665" stroke="#990000" stroke-width="5" marker-end="url(#arrow-crimson-large-rev)" />
    <rect x="1236" y="680" width="86" height="42" rx="6" fill="#FFFFFF" stroke="#990000" stroke-width="2" />
    <text x="1279" y="707" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#990000">
      ◀ Gate
    </text>
  </g>

  <!-- ==================== CARD 1: TIER 1 EDGE MESH (X=50, Width=544, Center X=322) ==================== -->
  <g id="card-edge-mesh">
    <!-- Solid Crisp 2px Border, 544px Wide Container (Height = 790px) -->
    <rect x="50" y="165" width="544" height="790" rx="12" fill="#F8FAFC" stroke="#004080" stroke-width="2" />

    <!-- Top Category Banner -->
    <rect x="75" y="188" width="494" height="38" rx="6" fill="#004080" />
    <text x="322" y="213" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      TIER 1 : DISTRIBUTED EDGE MESH
    </text>

    <!-- Centered Header with Strict Bounding Limits (Font size 36px, text-anchor="middle") -->
    <text x="322" y="275" text-anchor="middle" font-family="'Inter', sans-serif" font-size="36" font-weight="800" fill="#1A1A1A">
      Edge Mesh
    </text>
    <text x="322" y="308" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#004080">
      Raspberry Pi 4B Intersection Cluster
    </text>

    <line x1="85" y1="332" x2="559" y2="332" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Feature List (Shared relative starting X = 50 + 38 = 88) -->
    <g transform="translate(88, 365)">
      <!-- Item 1 -->
      <circle cx="8" cy="12" r="6" fill="#004080" />
      <text x="26" y="18" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">
        Decentralized RL Control
      </text>
      <text x="26" y="44" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#4A5568">
        112-D PPO Actor-Critic edge policy
      </text>

      <!-- Item 2 (+95px dy spacing) -->
      <circle cx="8" cy="107" r="6" fill="#004080" />
      <text x="26" y="113" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">
        Edge Vision &amp; ANPR
      </text>
      <text x="26" y="139" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#4A5568">
        YOLOv8n INT8 model with thermal model
      </text>

      <!-- Item 3 (+95px dy spacing) -->
      <circle cx="8" cy="202" r="6" fill="#004080" />
      <text x="26" y="208" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">
        P2P Mesh Protocol
      </text>
      <text x="26" y="234" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#4A5568">
        Decentralized state exchange with neighbors
      </text>

      <!-- Item 4 (+95px dy spacing) -->
      <circle cx="8" cy="297" r="6" fill="#004080" />
      <text x="26" y="303" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">
        ZSPF Island Fallback
      </text>
      <text x="26" y="329" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#4A5568">
        Independent Mode 2 Max-Pressure safety floor
      </text>
    </g>

    <!-- Bottom KPI Card (Centered at X=322) -->
    <rect x="85" y="760" width="474" height="95" rx="8" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="322" y="800" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#004080">
      Sub-100ms Inference Latency
    </text>
    <text x="322" y="832" text-anchor="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#1A1A1A">
      Deterministic Real-Time Execution
    </text>

    <!-- Technical Specification Pill -->
    <rect x="85" y="872" width="474" height="42" rx="6" fill="#EDF2F7" />
    <text x="322" y="899" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#2D3748">
      RPi 4B (4GB) • INT8 NCNN • Mode 0/1/2 Support
    </text>
  </g>

  <!-- ==================== CARD 2: MIDDLEWARE MQTT COMM BUS (X=688, Width=544, Center X=960) ==================== -->
  <g id="card-mqtt-bus">
    <!-- Solid Crisp 2px Border in Emerald Green, 544px Wide Container (Height = 790px) -->
    <rect x="688" y="165" width="544" height="790" rx="12" fill="#F8FAFC" stroke="#006633" stroke-width="2" />

    <!-- Top Category Banner -->
    <rect x="713" y="188" width="494" height="38" rx="6" fill="#006633" />
    <text x="960" y="213" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      COMMUNICATION MIDDLEWARE BUS
    </text>

    <!-- Centered Header with Strict Bounding Limits (Font size 36px, text-anchor="middle") -->
    <text x="960" y="275" text-anchor="middle" font-family="'Inter', sans-serif" font-size="36" font-weight="800" fill="#1A1A1A">
      MQTT Comm Bus
    </text>
    <text x="960" y="308" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#006633">
      Low-Latency Pub/Sub Mesh Topology
    </text>

    <line x1="723" y1="332" x2="1197" y2="332" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Feature List (Shared relative starting X = 688 + 38 = 726) -->
    <g transform="translate(726, 365)">
      <!-- Item 1 -->
      <circle cx="8" cy="12" r="6" fill="#006633" />
      <text x="26" y="18" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">
        Async MQTT Broker
      </text>
      <text x="26" y="44" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#4A5568">
        Dual subscription to heartbeat &amp; peer state
      </text>

      <!-- Item 2 (+95px dy spacing) -->
      <circle cx="8" cy="107" r="6" fill="#006633" />
      <text x="26" y="113" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">
        MessagePack Protocol
      </text>
      <text x="26" y="139" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#4A5568">
        Compact sub-100 byte binary payloads
      </text>

      <!-- Item 3 (+95px dy spacing) -->
      <circle cx="8" cy="202" r="6" fill="#006633" />
      <text x="26" y="208" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">
        Active ZSPF Liveness
      </text>
      <text x="26" y="234" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#4A5568">
        Strict 3.0s heartbeat expiration monitor
      </text>

      <!-- Item 4 (+95px dy spacing) -->
      <circle cx="8" cy="297" r="6" fill="#006633" />
      <text x="26" y="303" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">
        Simulation Fallback
      </text>
      <text x="26" y="329" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#4A5568">
        Zero external broker dependencies
      </text>
    </g>

    <!-- Bottom KPI Card (Centered at X=960) -->
    <rect x="723" y="760" width="474" height="95" rx="8" fill="#FFFFFF" stroke="#006633" stroke-width="2" />
    <text x="960" y="800" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#006633">
      Zero Data Loss Failover
    </text>
    <text x="960" y="832" text-anchor="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#1A1A1A">
      Instant Broker Degradation to Mode 2
    </text>

    <!-- Technical Specification Pill -->
    <rect x="723" y="872" width="474" height="42" rx="6" fill="#EDF2F7" />
    <text x="960" y="899" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#2D3748">
      paho-mqtt • MessagePack Bin • 1883/TCP
    </text>
  </g>

  <!-- ==================== CARD 3: TIER 2 GLOBAL ORCHESTRATOR (X=1326, Width=544, Center X=1598) ==================== -->
  <g id="card-global-orchestrator">
    <!-- Solid Crisp 2px Border in Corporate Blue, 544px Wide Container (Height = 790px) -->
    <rect x="1326" y="165" width="544" height="790" rx="12" fill="#F8FAFC" stroke="#004080" stroke-width="2" />

    <!-- Top Category Banner -->
    <rect x="1351" y="188" width="494" height="38" rx="6" fill="#004080" />
    <text x="1598" y="213" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      TIER 2 : REGIONAL SUPERVISION
    </text>

    <!-- Centered Header with Strict Bounding Limits (Font size 36px, text-anchor="middle" strictly inside 544px) -->
    <text x="1598" y="275" text-anchor="middle" font-family="'Inter', sans-serif" font-size="36" font-weight="800" fill="#1A1A1A">
      Global Orchestrator
    </text>
    <text x="1598" y="308" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#004080">
      Regional Traffic Supervision &amp; Policy
    </text>

    <line x1="1361" y1="332" x2="1835" y2="332" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Feature List (Shared relative starting X = 1326 + 38 = 1364) -->
    <g transform="translate(1364, 365)">
      <!-- Item 1 -->
      <circle cx="8" cy="12" r="6" fill="#004080" />
      <text x="26" y="18" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">
        Multi-Node Consensus
      </text>
      <text x="26" y="44" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#4A5568">
        ≥2 edge camera detections required in 30s
      </text>

      <!-- Item 2 (+95px dy spacing) -->
      <circle cx="8" cy="107" r="6" fill="#004080" />
      <text x="26" y="113" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">
        Security Corridor Overrides
      </text>
      <text x="26" y="139" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#4A5568">
        Perimeter trap barrier actuation at Node C2
      </text>

      <!-- Item 3 (+95px dy spacing) -->
      <circle cx="8" cy="202" r="6" fill="#004080" />
      <text x="26" y="208" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">
        Ethical HITL Gateway
      </text>
      <text x="26" y="234" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#4A5568">
        State lock PENDING_AUTHORIZATION
      </text>

      <!-- Item 4 (+95px dy spacing) -->
      <circle cx="8" cy="297" r="6" fill="#004080" />
      <text x="26" y="303" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">
        Dispatcher REST API
      </text>
      <text x="26" y="329" font-family="'Inter', sans-serif" font-size="17" font-weight="500" fill="#4A5568">
        Mandatory human confirmation trigger
      </text>
    </g>

    <!-- Bottom KPI Card (Centered at X=1598) -->
    <rect x="1361" y="760" width="474" height="95" rx="8" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="1598" y="800" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#004080">
      Ethical Gate Lock
    </text>
    <text x="1598" y="832" text-anchor="middle" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#1A1A1A">
      Mandatory Dispatcher Approval
    </text>

    <!-- Technical Specification Pill -->
    <rect x="1361" y="872" width="474" height="42" rx="6" fill="#EDF2F7" />
    <text x="1598" y="899" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#2D3748">
      Flask • Flask-SocketIO • REST Gateway
    </text>
  </g>

  <!-- ==================== BOTTOM SUMMARY BAR ==================== -->
  <g id="bottom-bar">
    <rect x="50" y="975" width="1820" height="75" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <text x="322" y="1022" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#004080">
      ✦ Tier 1: Local Edge Autonomy (RPi 4B)
    </text>
    <text x="960" y="1022" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#006633">
      ✦ Zero Single Point of Failure (ZSPF)
    </text>
    <text x="1598" y="1022" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#004080">
      ✦ Tier 2: Human-in-the-Loop Gateway
    </text>
  </g>
</svg>
