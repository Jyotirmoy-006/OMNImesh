    </text>

    <line x1="716" y1="355" x2="1204" y2="355" stroke="#CBD5E1" stroke-width="2" />

    <!-- Feature List (Bullets >= 32px, Subtext >= 24px) -->
    <g transform="translate(716, 375)">
      <circle cx="8" cy="10" r="6" fill="#006633" />
      <text x="28" y="18" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#1A1A1A">
        Async MQTT Broker
      </text>
      <text x="28" y="46" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#4A5568">
        Heartbeat &amp; Peer State Subscriptions
      </text>

      <circle cx="8" cy="98" r="6" fill="#006633" />
      <text x="28" y="106" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#1A1A1A">
        MessagePack Protocol
      </text>
      <text x="28" y="134" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#4A5568">
        Compact Sub-100 Byte Binary Payloads
      </text>

      <circle cx="8" cy="186" r="6" fill="#006633" />
      <text x="28" y="194" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#1A1A1A">
        Active ZSPF Liveness
      </text>
      <text x="28" y="222" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#4A5568">
        Strict 3.0s Expiration Monitor
      </text>

      <circle cx="8" cy="274" r="6" fill="#006633" />
      <text x="28" y="282" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#1A1A1A">
        Simulation Fallback
      </text>
      <text x="28" y="310" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#4A5568">
        Zero External Broker Dependencies
      </text>
    </g>

    <!-- Bottom KPI Card -->
    <rect x="716" y="745" width="488" height="100" rx="10" fill="#FFFFFF" stroke="#006633" stroke-width="2.5" />
    <text x="960" y="788" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="#006633">
      Zero Data Loss
    </text>
    <text x="960" y="824" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24" font-weight="600" fill="#1A1A1A">
      Instant Broker Failover to Mode 2
    </text>

    <!-- Technical Specification Pill -->
    <rect x="716" y="860" width="488" height="44" rx="8" fill="#EDF2F7" />
    <text x="960" y="889" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#2D3748">
      paho-mqtt • MessagePack Bin • 1883/TCP
    </text>
  </g>

  <!-- ==================== CARD 3: TIER 2 GLOBAL ORCHESTRATOR (544px WIDE) ==================== -->
  <g id="card-global-orchestrator">
    <!-- Solid Crisp 2.5px Border in Corporate Blue -->
    <rect x="1326" y="170" width="544" height="755" rx="14" fill="#F8FAFC" stroke="#004080" stroke-width="2.5" />

    <!-- Top Category Banner -->
    <rect x="1351" y="195" width="494" height="42" rx="8" fill="#004080" />
    <text x="1598" y="224" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="2">
      TIER 2 : REGIONAL SUPERVISION
    </text>

    <!-- Header Title (Min 48px, Bold) -->
    <text x="1354" y="295" font-family="'Inter', sans-serif" font-size="50" font-weight="800" fill="#1A1A1A">
      Global Orchestrator
    </text>
    <text x="1354" y="332" font-family="'Inter', sans-serif" font-size="24" font-weight="600" fill="#004080">
      Regional Traffic Supervision &amp; Policy
    </text>

    <line x1="1354" y1="355" x2="1842" y2="355" stroke="#CBD5E1" stroke-width="2" />

    <!-- Feature List (Bullets >= 32px, Subtext >= 24px) -->
    <g transform="translate(1354, 375)">
      <circle cx="8" cy="10" r="6" fill="#004080" />
      <text x="28" y="18" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#1A1A1A">
        Multi-Node Consensus
      </text>
      <text x="28" y="46" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#4A5568">
        ≥2 Edge Detections Required in 30s
      </text>

      <circle cx="8" cy="98" r="6" fill="#004080" />
      <text x="28" y="106" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#1A1A1A">
        Security Overrides
      </text>
      <text x="28" y="134" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#4A5568">
        Perimeter Trap Barrier at Node C2
      </text>

      <circle cx="8" cy="186" r="6" fill="#004080" />
      <text x="28" y="194" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#1A1A1A">
        Ethical HITL Gateway
      </text>
      <text x="28" y="222" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#4A5568">
        State Lock PENDING_AUTHORIZATION
      </text>

      <circle cx="8" cy="274" r="6" fill="#004080" />
      <text x="28" y="282" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#1A1A1A">
        Dispatcher REST API
      </text>
      <text x="28" y="310" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#4A5568">
        Mandatory Human Approval Trigger
      </text>
    </g>

    <!-- Bottom KPI Card -->
    <rect x="1354" y="745" width="488" height="100" rx="10" fill="#FFFFFF" stroke="#004080" stroke-width="2.5" />
    <text x="1598" y="788" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="#004080">
      Ethical Gate Lock
    </text>
    <text x="1598" y="824" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24" font-weight="600" fill="#1A1A1A">
      Mandatory Dispatcher Approval
    </text>

    <!-- Technical Specification Pill -->
    <rect x="1354" y="860" width="488" height="44" rx="8" fill="#EDF2F7" />
    <text x="1598" y="889" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#2D3748">
      Flask • Flask-SocketIO • REST API
    </text>
  </g>

  <!-- ==================== BOTTOM SUMMARY BAR ==================== -->
  <g id="bottom-bar">
    <rect x="50" y="945" width="1820" height="90" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2.5" />
    <text x="322" y="1000" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#004080">
      ✦ Tier 1: Local Edge Autonomy (RPi 4B)
    </text>
    <text x="960" y="1000" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#006633">
      ✦ Zero Single Point of Failure (ZSPF)
    </text>
    <text x="1598" y="1000" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#004080">
      ✦ Tier 2: Human-in-the-Loop Gateway
    </text>
  </g>
</svg>
