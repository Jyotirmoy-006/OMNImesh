    </text>

    <line x1="1485" y1="325" x2="1850" y2="325" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Massive Single-Line Bullet Points -->
    <g transform="translate(1478, 0)">
      <!-- Bullet 1 -->
      <circle cx="12" cy="415" r="8" fill="#004080" />
      <text x="32" y="424" font-family="'Inter', sans-serif" font-size="21.5" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
