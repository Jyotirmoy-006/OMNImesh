<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure White Academic Background -->
  <rect width="1920" height="1080" fill="#FFFFFF" />

  <!-- Outer Academic Framing -->
  <rect x="20" y="20" width="1880" height="1040" fill="none" stroke="#CBD5E1" stroke-width="2" rx="8" />

  <!-- ==================== HEADER SECTION ==================== -->
  <g id="header-section">
    <text x="960" y="75" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="800" fill="#004080" letter-spacing="-0.5">
      OMNI-MESH RESEARCH METHODOLOGY
    </text>
    <text x="960" y="118" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="600" fill="#4A5568">
      Four-Stage Scientific Pipeline &amp; Experimental Simulation Framework
    </text>
    <line x1="50" y1="145" x2="1870" y2="145" stroke="#CBD5E1" stroke-width="2" />
  </g>

  <!-- ==================== DIRECTIONAL CHEVRONS ==================== -->
  <g id="chevron-1">
    <path d="M 482 520 L 502 540 L 482 560" fill="none" stroke="#004080" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g id="chevron-2">
    <path d="M 952 520 L 972 540 L 952 560" fill="none" stroke="#006633" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g id="chevron-3">
    <path d="M 1422 520 L 1442 540 L 1422 560" fill="none" stroke="#004080" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== CARD 1: MICRO-SIMULATION (X=50, Width=415, Center X=258) ==================== -->
  <g id="card-stage-1">
    <rect x="50" y="165" width="415" height="790" rx="12" fill="#F8FAFC" stroke="#004080" stroke-width="2" />

    <!-- Top Stage Banner -->
    <rect x="70" y="188" width="375" height="38" rx="6" fill="#004080" />
    <text x="258" y="213" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      STAGE 01 : PHYSICS ENVIRONMENT
    </text>

    <!-- Centered Header -->
    <text x="258" y="285" text-anchor="middle" font-family="'Inter', sans-serif" font-size="34" font-weight="800" fill="#1A1A1A">
      Micro-Simulation
    </text>

    <line x1="75" y1="325" x2="440" y2="325" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Massive Single-Line Bullet Points -->
    <g transform="translate(68, 0)">
      <!-- Bullet 1 -->
      <circle cx="12" cy="415" r="8" fill="#004080" />
      <text x="32" y="424" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        4x4 virtual SUMO city grid.
      </text>

      <!-- Bullet 2 -->
      <circle cx="12" cy="535" r="8" fill="#004080" />
      <text x="32" y="544" font-family="'Inter', sans-serif" font-size="20.5" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Measures red-light vehicle queues.
      </text>

      <!-- Bullet 3 -->
      <circle cx="12" cy="655" r="8" fill="#004080" />
      <text x="32" y="664" font-family="'Inter', sans-serif" font-size="20.5" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Injects simulated hardware glitches.
      </text>
    </g>

    <!-- Bottom KPI Card -->
    <rect x="75" y="760" width="365" height="135" rx="10" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="258" y="838" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#004080">
      Virtual Ground Truth
    </text>
  </g>

  <!-- ==================== CARD 2: DUAL-OBJECTIVE AI (X=520, Width=415, Center X=728) ==================== -->
  <g id="card-stage-2">
    <rect x="520" y="165" width="415" height="790" rx="12" fill="#F8FAFC" stroke="#004080" stroke-width="2" />

