<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15" />
      <stop offset="50%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#080C15" />
    </linearGradient>

    <!-- Block 1: Edge Mesh Gradient -->
    <linearGradient id="grad-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#081326" />
    </linearGradient>

    <!-- Block 2: MQTT Bus Gradient -->
    <linearGradient id="grad-mqtt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082822" />
      <stop offset="100%" stop-color="#051714" />
    </linearGradient>

    <!-- Block 3: Global Orchestrator Gradient -->
    <linearGradient id="grad-orch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1438" />
      <stop offset="100%" stop-color="#100A22" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue-right" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-blue-left" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 12 1 L 1 6 L 12 11 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-green-right" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#34D399" />
    </marker>
    <marker id="arrow-purple-right" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#C084FC" />
    </marker>
    <marker id="arrow-purple-left" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 12 1 L 1 6 L 12 11 z" fill="#C084FC" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="120" x2="1920" y2="120" />
    <line x1="0" y1="240" x2="1920" y2="240" />
    <line x1="0" y1="360" x2="1920" y2="360" />
    <line x1="0" y1="480" x2="1920" y2="480" />
    <line x1="0" y1="600" x2="1920" y2="600" />
    <line x1="0" y1="720" x2="1920" y2="720" />
    <line x1="0" y1="840" x2="1920" y2="840" />
    <line x1="0" y1="960" x2="1920" y2="960" />
    <line x1="240" y1="0" x2="240" y2="1080" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="720" y1="0" x2="720" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1200" y1="0" x2="1200" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
    <line x1="1680" y1="0" x2="1680" y2="1080" />
  </g>

  <!-- ==================== TOP HEADER SECTION ==================== -->
  <g id="header-section">
    <!-- Main Title (Massive >= 56pt) -->
    <text x="960" y="95" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="60" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
      OMNI-MESH SYSTEM ARCHITECTURE
    </text>
    <!-- Subtitle (>= 32pt) -->
    <text x="960" y="155" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="500" fill="#94A3B8">
      Three-Tier Decentralized Edge Architecture &amp; Data Flow
    </text>
  </g>

  <!-- ==================== CONNECTORS & DATA FLOW PIPES ==================== -->
  <!-- Connector 1: Edge Mesh <-> MQTT Comm Bus (x=550 to x=730, width=180) -->
  <g id="connector-edge-mqtt">
    <!-- Top Flow: P2P States / Telemetry (Edge -> Bus) -->
    <path d="M 550 490 L 715 490" stroke="#38BDF8" stroke-width="6" marker-end="url(#arrow-blue-right)" />
    <rect x="565" y="435" width="150" height="42" rx="10" fill="#0C213D" stroke="#38BDF8" stroke-width="2" />
    <text x="640" y="466" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#38BDF8">
      States ▶
    </text>

    <!-- Bottom Flow: Heartbeats / Directives (Bus -> Edge) -->
    <path d="M 730 670 L 565 670" stroke="#34D399" stroke-width="6" marker-end="url(#arrow-blue-left)" />
    <rect x="565" y="695" width="150" height="42" rx="10" fill="#082A22" stroke="#34D399" stroke-width="2" />
    <text x="640" y="726" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#34D399">
      ◀ Sync
    </text>
  </g>

  <!-- Connector 2: MQTT Comm Bus <-> Global Orchestrator (x=1190 to x=1370, width=180) -->
  <g id="connector-mqtt-orch">
    <!-- Top Flow: Alert Frames (Bus -> Orchestrator) -->
    <path d="M 1190 490 L 1355 490" stroke="#C084FC" stroke-width="6" marker-end="url(#arrow-purple-right)" />
    <rect x="1205" y="435" width="150" height="42" rx="10" fill="#251345" stroke="#C084FC" stroke-width="2" />
    <text x="1280" y="466" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#C084FC">
      Alerts ▶
    </text>

    <!-- Bottom Flow: Containment Overrides (Orchestrator -> Bus) -->
    <path d="M 1370 670 L 1205 670" stroke="#F43F5E" stroke-width="6" marker-end="url(#arrow-purple-left)" />
    <rect x="1205" y="695" width="150" height="42" rx="10" fill="#35101E" stroke="#F43F5E" stroke-width="2" />
    <text x="1280" y="726" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#FB7185">
      ◀ Gates
    </text>
  </g>

  <!-- ==================== BLOCK 1: EDGE MESH (RPI 4B AGENTS) ==================== -->
  <g id="block-edge-mesh">
    <!-- Main Outer Card -->
    <rect x="90" y="225" width="460" height="685" rx="28" fill="url(#grad-edge)" stroke="#3B82F6" stroke-width="5" />

    <!-- Header Category Badge (>= 32pt) -->
    <rect x="135" y="260" width="370" height="56" rx="16" fill="#1E3A8A" stroke="#60A5FA" stroke-width="3" />
    <text x="320" y="300" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="#93C5FD">
      TIER 1 : EDGE
    </text>

    <!-- Block Title (>= 56pt) & Sub-title (>= 32pt) -->
    <text x="320" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">
      Edge Mesh
    </text>
    <text x="320" y="430" text-anchor="middle" font-family="'Inter', sans-serif" font-size="34" font-weight="700" fill="#60A5FA">
      (RPi 4B Agents)
    </text>

    <!-- Decorative Accent Divider -->
    <line x1="135" y1="465" x2="505" y2="465" stroke="#1D4ED8" stroke-width="4" />

    <!-- Core High-Level Pillars (Body Text >= 32pt) -->
    <text x="140" y="535" font-family="'Inter', sans-serif" font-size="34" font-weight="600" fill="#E2E8F0">
      • Distributed Signal Control
    </text>
    <text x="140" y="605" font-family="'Inter', sans-serif" font-size="34" font-weight="600" fill="#E2E8F0">
      • Real-Time Vision &amp; ANPR
    </text>
    <text x="140" y="675" font-family="'Inter', sans-serif" font-size="34" font-weight="600" fill="#E2E8F0">
      • Autonomous P2P Mesh
    </text>

    <!-- Bottom Status / Metric Card (>= 32pt) -->
    <rect x="130" y="745" width="380" height="125" rx="20" fill="#0C1D38" stroke="#38BDF8" stroke-width="3" />
    <text x="320" y="798" text-anchor="middle" font-family="'Inter', sans-serif" font-size="36" font-weight="800" fill="#38BDF8">
      Sub-100ms Control
    </text>
    <text x="320" y="845" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="600" fill="#93C5FD">
      Independent Local Policy
    </text>
  </g>

  <!-- ==================== BLOCK 2: MQTT COMM BUS ==================== -->
  <g id="block-mqtt-bus">
    <!-- Main Outer Card -->
    <rect x="730" y="225" width="460" height="685" rx="28" fill="url(#grad-mqtt)" stroke="#10B981" stroke-width="5" />

    <!-- Header Category Badge (>= 32pt) -->
    <rect x="775" y="260" width="370" height="56" rx="16" fill="#064E3B" stroke="#34D399" stroke-width="3" />
    <text x="960" y="300" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="#A7F3D0">
      MIDDLEWARE
    </text>

    <!-- Block Title (>= 56pt) & Sub-title (>= 32pt) -->
    <text x="960" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">
      MQTT Comm Bus
    </text>
    <text x="960" y="430" text-anchor="middle" font-family="'Inter', sans-serif" font-size="34" font-weight="700" fill="#34D399">
      (MessagePack Protocol)
    </text>

    <!-- Decorative Accent Divider -->
    <line x1="775" y1="465" x2="1145" y2="465" stroke="#059669" stroke-width="4" />

    <!-- Core High-Level Pillars (Body Text >= 32pt) -->
    <text x="780" y="535" font-family="'Inter', sans-serif" font-size="34" font-weight="600" fill="#E2E8F0">
      • Lightweight Pub/Sub Mesh
    </text>
    <text x="780" y="605" font-family="'Inter', sans-serif" font-size="34" font-weight="600" fill="#E2E8F0">
      • Sub-100B Binary Packets
    </text>
    <text x="780" y="675" font-family="'Inter', sans-serif" font-size="34" font-weight="600" fill="#E2E8F0">
      • Active ZSPF Heartbeats
    </text>

    <!-- Bottom Status / Metric Card (>= 32pt) -->
    <rect x="770" y="745" width="380" height="125" rx="20" fill="#072A24" stroke="#10B981" stroke-width="3" />
    <text x="960" y="798" text-anchor="middle" font-family="'Inter', sans-serif" font-size="36" font-weight="800" fill="#34D399">
      Zero Data Loss
    </text>
    <text x="960" y="845" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="600" fill="#A7F3D0">
      Instant Broker Failover
    </text>
  </g>

  <!-- ==================== BLOCK 3: GLOBAL ORCHESTRATOR ==================== -->
  <g id="block-global-orchestrator">
    <!-- Main Outer Card -->
    <rect x="1370" y="225" width="460" height="685" rx="28" fill="url(#grad-orch)" stroke="#8B5CF6" stroke-width="5" />

    <!-- Header Category Badge (>= 32pt) -->
    <rect x="1415" y="260" width="370" height="56" rx="16" fill="#4C1D95" stroke="#C084FC" stroke-width="3" />
    <text x="1600" y="300" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="#DDD6FE">
      TIER 2 : SUPERVISION
    </text>

    <!-- Block Title (>= 56pt) & Sub-title (>= 32pt) -->
    <text x="1600" y="380" text-anchor="middle" font-family="'Inter', sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">
      Global Orchestrator
    </text>
    <text x="1600" y="430" text-anchor="middle" font-family="'Inter', sans-serif" font-size="34" font-weight="700" fill="#C084FC">
      (Cloud / Traffic Center)
    </text>

    <!-- Decorative Accent Divider -->
    <line x1="1415" y1="465" x2="1785" y2="465" stroke="#7C3AED" stroke-width="4" />

    <!-- Core High-Level Pillars (Body Text >= 32pt) -->
    <text x="1420" y="535" font-family="'Inter', sans-serif" font-size="34" font-weight="600" fill="#E2E8F0">
      • Multi-Node Consensus
    </text>
    <text x="1420" y="605" font-family="'Inter', sans-serif" font-size="34" font-weight="600" fill="#E2E8F0">
      • Area Security Overrides
    </text>
    <text x="1420" y="675" font-family="'Inter', sans-serif" font-size="34" font-weight="600" fill="#E2E8F0">
      • Human-in-the-Loop Gate
    </text>

    <!-- Bottom Status / Metric Card (>= 32pt) -->
    <rect x="1410" y="745" width="380" height="125" rx="20" fill="#261545" stroke="#8B5CF6" stroke-width="3" />
    <text x="1600" y="798" text-anchor="middle" font-family="'Inter', sans-serif" font-size="36" font-weight="800" fill="#C084FC">
      Ethical Verification
    </text>
    <text x="1600" y="845" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="600" fill="#E9D5FF">
      Dispatcher Authorization
    </text>
  </g>

  <!-- ==================== BOTTOM ARCHITECTURE BAR ==================== -->
  <g id="bottom-summary-bar">
    <rect x="90" y="945" width="1740" height="90" rx="24" fill="#0F172A" stroke="#334155" stroke-width="3" />
    <text x="360" y="1003" text-anchor="middle" font-family="'Inter', sans-serif" font-size="34" font-weight="700" fill="#38BDF8">
      ✦ Edge Autonomy (RPi 4B)
    </text>
    <text x="960" y="1003" text-anchor="middle" font-family="'Inter', sans-serif" font-size="34" font-weight="700" fill="#34D399">
      ✦ Zero Single Point Failure (ZSPF)
    </text>
    <text x="1560" y="1003" text-anchor="middle" font-family="'Inter', sans-serif" font-size="34" font-weight="700" fill="#C084FC">
      ✦ Dispatcher HITL Gate
    </text>
  </g>
</svg>
