      </text>

      <!-- Bullet 2 -->
      <circle cx="12" cy="535" r="8" fill="#004080" />
      <text x="32" y="544" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Requires human dispatcher approval.
      </text>

      <!-- Bullet 3 -->
      <circle cx="12" cy="655" r="8" fill="#004080" />
      <text x="32" y="664" font-family="'Inter', sans-serif" font-size="20.5" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Developer mode for rapid testing.
      </text>
    </g>

    <!-- Bottom KPI Card -->
    <rect x="1485" y="760" width="365" height="135" rx="10" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="1668" y="838" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#004080">
      Empirical Validation
    </text>
  </g>

  <!-- ==================== BOTTOM SUMMARY BAR ==================== -->
  <g id="bottom-bar">
    <rect x="50" y="975" width="1825" height="75" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <text x="962" y="1022" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#1A1A1A">
      Microscopic Physics Co-Simulation  ➔  Dual-Objective AI Policy  ➔  ZSPF Fail-Safe Resilience  ➔  Human-in-the-Loop Ethical Gateway
    </text>
  </g>
