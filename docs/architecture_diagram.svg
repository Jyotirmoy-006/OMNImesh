<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure White Academic Background -->
  <rect width="1920" height="1080" fill="#FFFFFF" />

  <!-- Outer Academic Frame -->
  <rect x="20" y="20" width="1880" height="1040" fill="none" stroke="#CBD5E1" stroke-width="2" rx="8" />

  <!-- Marker Definitions for High-Contrast 4px Directional Arrows -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#004080" />
    </marker>
    <marker id="arrow-green-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 2 L 2 5 L 9 8 z" fill="#006633" />
    </marker>
    <marker id="arrow-blue-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 2 L 2 5 L 9 8 z" fill="#004080" />
    </marker>
    <marker id="arrow-crimson-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 2 L 2 5 L 9 8 z" fill="#990000" />
    </marker>
  </defs>

  <!-- ==================== HEADER SECTION ==================== -->
  <g id="header-section">
    <text x="960" y="80" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#004080" letter-spacing="-0.5">
      OMNI-MESH SYSTEM ARCHITECTURE
    </text>
    <text x="960" y="118" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="19" font-weight="500" fill="#4A5568">
      Three-Tier Decentralized Edge Architecture &amp; Real-Time Data Flow Overview
    </text>
    <line x1="60" y1="145" x2="1860" y2="145" stroke="#CBD5E1" stroke-width="2" />
  </g>

  <!-- ==================== INTERCONNECTING DATA-FLOW ARROWS (THICK 4px STROKES) ==================== -->
  <!-- Gap 1: Edge Mesh <-> MQTT Comm Bus (X=560 to X=710, Width=150px) -->
  <g id="connector-edge-bus">
    <!-- Top Flow: States (Edge -> Bus) -->
    <path d="M 575 460 L 695 460" stroke="#004080" stroke-width="4" marker-end="url(#arrow-blue)" />
    <rect x="585" y="415" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="635" y="438" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#004080">
      States ▶
    </text>

    <!-- Bottom Flow: Sync / Directives (Bus -> Edge) -->
    <path d="M 695 650 L 575 650" stroke="#006633" stroke-width="4" marker-end="url(#arrow-green-rev)" />
    <rect x="585" y="665" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#006633" stroke-width="2" />
    <text x="635" y="688" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#006633">
      ◀ Sync
    </text>
  </g>

  <!-- Gap 2: MQTT Comm Bus <-> Global Orchestrator (X=1210 to X=1360, Width=150px) -->
  <g id="connector-bus-orch">
    <!-- Top Flow: Alerts (Bus -> Orchestrator) -->
    <path d="M 1225 460 L 1345 460" stroke="#004080" stroke-width="4" marker-end="url(#arrow-blue)" />
    <rect x="1235" y="415" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="1285" y="438" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#004080">
      Alerts ▶
    </text>

    <!-- Bottom Flow: Overrides (Orchestrator -> Bus) -->
    <path d="M 1345 650 L 1225 650" stroke="#990000" stroke-width="4" marker-end="url(#arrow-crimson-rev)" />
    <rect x="1225" y="665" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#990000" stroke-width="2" />
    <text x="1285" y="688" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#990000">
      ◀ Override
    </text>
  </g>

  <!-- ==================== CARD 1: EDGE MESH (RPI 4B AGENTS) ==================== -->
  <g id="card-edge-mesh">
    <!-- Solid Crisp 2px Border, 500px Wide Container -->
    <rect x="60" y="175" width="500" height="745" rx="12" fill="#F8FAFC" stroke="#004080" stroke-width="2" />

    <!-- Top Category Banner -->
    <rect x="80" y="200" width="460" height="36" rx="6" fill="#004080" />
    <text x="310" y="224" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      TIER 1 : DISTRIBUTED EDGE MESH
    </text>

    <!-- Header Title (Single Line, Max 28px) -->
    <text x="90" y="280" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#1A1A1A">
      Edge Mesh (RPi 4B Agents)
    </text>
    <text x="90" y="310" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#004080">
      Autonomous Local Traffic Light Controller
    </text>

    <line x1="90" y1="335" x2="530" y2="335" stroke="#E2E8F0" stroke-width="2" />

    <!-- Structured Feature List -->
    <g transform="translate(90, 375)">
      <circle cx="6" cy="6" r="4" fill="#004080" />
      <text x="24" y="12" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">
        Decentralized Phase Optimization
      </text>
      <text x="24" y="34" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#4A5568">
        112-D PPO Actor-Critic edge inference
      </text>

      <circle cx="6" cy="74" r="4" fill="#004080" />
      <text x="24" y="80" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">
        Edge Vision &amp; ANPR Perception Loop
      </text>
      <text x="24" y="102" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#4A5568">
        YOLOv8n INT8 model with thermal dropout
      </text>

      <circle cx="6" cy="142" r="4" fill="#004080" />
      <text x="24" y="148" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">
        P2P Mesh Communication Protocol
      </text>
      <text x="24" y="170" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#4A5568">
        Decentralized state exchange with neighbors
      </text>

      <circle cx="6" cy="210" r="4" fill="#004080" />
      <text x="24" y="216" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">
        Active ZSPF Mode 2 Island Fallback
      </text>
      <text x="24" y="238" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#4A5568">
        Independent Max-Pressure safety floor
      </text>
    </g>

    <!-- Bottom KPI Card -->
    <rect x="90" y="665" width="440" height="85" rx="8" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="310" y="702" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#004080">
      Sub-100ms Inference Latency
    </text>
    <text x="310" y="730" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">
      Deterministic Real-Time Edge Loop
    </text>

    <!-- Technical Specification Pill -->
    <rect x="90" y="765" width="440" height="42" rx="6" fill="#EDF2F7" />
    <text x="310" y="792" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#2D3748">
      RPi 4B (4GB) • INT8 NCNN • Mode 0/1/2 Support
    </text>
  </g>

  <!-- ==================== CARD 2: MQTT COMM BUS ==================== -->
  <g id="card-mqtt-bus">
    <!-- Solid Crisp 2px Border in Emerald Green, 500px Wide Container -->
    <rect x="710" y="175" width="500" height="745" rx="12" fill="#F8FAFC" stroke="#006633" stroke-width="2" />

    <!-- Top Category Banner -->
    <rect x="730" y="200" width="460" height="36" rx="6" fill="#006633" />
    <text x="960" y="224" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      COMMUNICATION MIDDLEWARE BUS
    </text>

    <!-- Header Title (Single Line, Max 28px) -->
    <text x="740" y="280" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#1A1A1A">
      MQTT Comm Bus
    </text>
    <text x="740" y="310" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#006633">
      Asynchronous Pub/Sub Mesh Topology
    </text>

    <line x1="740" y1="335" x2="1180" y2="335" stroke="#E2E8F0" stroke-width="2" />

    <!-- Structured Feature List -->
    <g transform="translate(740, 375)">
      <circle cx="6" cy="6" r="4" fill="#006633" />
      <text x="24" y="12" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">
        High-Throughput MQTT Protocol
      </text>
      <text x="24" y="34" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#4A5568">
        Dual subscription to heartbeat &amp; peer state
      </text>

      <circle cx="6" cy="74" r="4" fill="#006633" />
      <text x="24" y="80" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">
        Compact MessagePack Serialization
      </text>
      <text x="24" y="102" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#4A5568">
        Sub-100 byte binary payloads (~80 bytes)
      </text>

      <circle cx="6" cy="142" r="4" fill="#006633" />
      <text x="24" y="148" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">
        Active ZSPF Liveness Monitoring
      </text>
      <text x="24" y="170" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#4A5568">
        Strict 3.0s heartbeat expiration threshold
      </text>

      <circle cx="6" cy="210" r="4" fill="#006633" />
      <text x="24" y="216" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">
        Pure-Software Simulation Fallback
      </text>
      <text x="24" y="238" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#4A5568">
        Zero dependency on external broker daemon
      </text>
    </g>

    <!-- Bottom KPI Card -->
    <rect x="740" y="665" width="440" height="85" rx="8" fill="#FFFFFF" stroke="#006633" stroke-width="2" />
    <text x="960" y="702" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#006633">
      Zero Single Point of Failure
    </text>
    <text x="960" y="730" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">
      Instant Broker Failover to Mode 2
    </text>

    <!-- Technical Specification Pill -->
    <rect x="740" y="765" width="440" height="42" rx="6" fill="#EDF2F7" />
    <text x="960" y="792" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#2D3748">
      paho-mqtt • MessagePack Bin • 1883/TCP
    </text>
  </g>

  <!-- ==================== CARD 3: GLOBAL ORCHESTRATOR ==================== -->
  <g id="card-global-orchestrator">
    <!-- Solid Crisp 2px Border in Corporate Blue, 500px Wide Container -->
    <rect x="1360" y="175" width="500" height="745" rx="12" fill="#F8FAFC" stroke="#004080" stroke-width="2" />

    <!-- Top Category Banner -->
    <rect x="1380" y="200" width="460" height="36" rx="6" fill="#004080" />
    <text x="1610" y="224" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      TIER 2 : REGIONAL ORCHESTRATION
    </text>

    <!-- Header Title (Single Line, Max 28px) -->
    <text x="1390" y="280" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#1A1A1A">
      Global Orchestrator
    </text>
    <text x="1390" y="310" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#004080">
      Regional Traffic Management Supervision
    </text>

    <line x1="1390" y1="335" x2="1830" y2="335" stroke="#E2E8F0" stroke-width="2" />

    <!-- Structured Feature List -->
    <g transform="translate(1390, 375)">
      <circle cx="6" cy="6" r="4" fill="#004080" />
      <text x="24" y="12" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">
        Multi-Node Temporal Consensus
      </text>
      <text x="24" y="34" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#4A5568">
        Requires ≥2 edge cameras in 30s to verify plate
      </text>

      <circle cx="6" cy="74" r="4" fill="#004080" />
      <text x="24" y="80" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">
        Dynamic Security Overrides
      </text>
      <text x="24" y="102" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#4A5568">
        Perimeter barrier actuation at Node C2
      </text>

      <circle cx="6" cy="142" r="4" fill="#004080" />
      <text x="24" y="148" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">
        Human-in-the-Loop Gateway
      </text>
      <text x="24" y="170" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#4A5568">
        Internal state lock (PENDING_AUTHORIZATION)
      </text>

      <circle cx="6" cy="210" r="4" fill="#004080" />
      <text x="24" y="216" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">
        Dispatcher REST API &amp; Dashboard
      </text>
      <text x="24" y="238" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#4A5568">
        POST /api/trigger/authorize_containment
      </text>
    </g>

    <!-- Bottom KPI Card -->
    <rect x="1390" y="665" width="440" height="85" rx="8" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="1610" y="702" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#004080">
      Ethical Authorization Gate
    </text>
    <text x="1610" y="730" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#1A1A1A">
      Mandatory Human Operator Approval
    </text>

    <!-- Technical Specification Pill -->
    <rect x="1390" y="765" width="440" height="42" rx="6" fill="#EDF2F7" />
    <text x="1610" y="792" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#2D3748">
      Flask Backend • SocketIO • REST Gateway
    </text>
  </g>

  <!-- ==================== BOTTOM SUMMARY BAR ==================== -->
  <g id="bottom-bar">
    <rect x="60" y="945" width="1800" height="80" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <text x="310" y="992" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#004080">
      ✦ Tier 1: Local Edge Autonomy (RPi 4B)
    </text>
    <text x="960" y="992" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#006633">
      ✦ Zero Single Point of Failure (ZSPF)
    </text>
    <text x="1610" y="992" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#004080">
      ✦ Tier 2: Human-in-the-Loop Ethical Gate
    </text>
  </g>
</svg>
