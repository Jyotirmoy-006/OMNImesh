<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure White Academic Background -->
  <rect width="1920" height="1080" fill="#FFFFFF" />

  <!-- Outer Academic Framing -->
  <rect x="20" y="20" width="1880" height="1040" fill="none" stroke="#CBD5E1" stroke-width="2" rx="8" />

  <!-- Marker Definitions for Directional Arrows -->
  <defs>
    <marker id="arrow-blue-large" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 2 L 10 6 L 1 10 z" fill="#004080" />
    </marker>
    <marker id="arrow-green-large-rev" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 11 2 L 2 6 L 11 10 z" fill="#006633" />
    </marker>
    <marker id="arrow-crimson-large-rev" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 11 2 L 2 6 L 11 10 z" fill="#990000" />
    </marker>
  </defs>

  <!-- ==================== HEADER SECTION ==================== -->
  <g id="header-section">
    <text x="960" y="75" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="800" fill="#004080" letter-spacing="-0.5">
      OMNI-MESH SYSTEM ARCHITECTURE
    </text>
    <text x="960" y="118" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="600" fill="#4A5568">
      Three-Tier Decentralized Software Architecture &amp; Simulation Data Flow
    </text>
    <line x1="50" y1="145" x2="1870" y2="145" stroke="#CBD5E1" stroke-width="2" />
  </g>

  <!-- ==================== DATA-FLOW ARROWS ==================== -->
  <!-- Gap 1: Edge Mesh <-> MQTT Comm Bus (X=594 to X=688, Center X=641) -->
  <g id="connector-edge-bus">
    <path d="M 598 475 L 682 475" stroke="#004080" stroke-width="5" marker-end="url(#arrow-blue-large)" />
    <rect x="599" y="420" width="84" height="42" rx="6" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="641" y="447" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#004080">
      States ▶
    </text>

    <path d="M 684 665 L 600 665" stroke="#006633" stroke-width="5" marker-end="url(#arrow-green-large-rev)" />
    <rect x="599" y="680" width="84" height="42" rx="6" fill="#FFFFFF" stroke="#006633" stroke-width="2" />
    <text x="641" y="707" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#006633">
      ◀ Sync
    </text>
  </g>

  <!-- Gap 2: MQTT Comm Bus <-> Global Orchestrator (X=1232 to X=1326, Center X=1279) -->
  <g id="connector-bus-orch">
    <path d="M 1236 475 L 1320 475" stroke="#004080" stroke-width="5" marker-end="url(#arrow-blue-large)" />
    <rect x="1237" y="420" width="84" height="42" rx="6" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="1279" y="447" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#004080">
      Alerts ▶
    </text>

    <path d="M 1322 665 L 1238 665" stroke="#990000" stroke-width="5" marker-end="url(#arrow-crimson-large-rev)" />
    <rect x="1236" y="680" width="86" height="42" rx="6" fill="#FFFFFF" stroke="#990000" stroke-width="2" />
    <text x="1279" y="707" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#990000">
      ◀ Gate
    </text>
  </g>

  <!-- ==================== CARD 1: TIER 1 EDGE MESH (X=50, Width=544, Center X=322) ==================== -->
  <g id="card-edge-mesh">
    <rect x="50" y="165" width="544" height="790" rx="12" fill="#F8FAFC" stroke="#004080" stroke-width="2" />

    <!-- Top Category Banner -->
    <rect x="75" y="188" width="494" height="38" rx="6" fill="#004080" />
    <text x="322" y="213" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      TIER 1 : DISTRIBUTED EDGE MESH
    </text>

    <!-- Centered Header -->
    <text x="322" y="285" text-anchor="middle" font-family="'Inter', sans-serif" font-size="40" font-weight="800" fill="#1A1A1A">
      Edge-Ready Software
    </text>

    <line x1="85" y1="325" x2="559" y2="325" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Massive Single-Line Bullet Points -->
    <g transform="translate(85, 0)">
      <!-- Bullet 1 -->
      <circle cx="14" cy="415" r="9" fill="#004080" />
      <text x="38" y="425" font-family="'Inter', sans-serif" font-size="26" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Simulated edge vision processing.
      </text>

      <!-- Bullet 2 -->
      <circle cx="14" cy="535" r="9" fill="#004080" />
      <text x="38" y="545" font-family="'Inter', sans-serif" font-size="26" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Peer-to-Peer traffic data sharing.
      </text>

      <!-- Bullet 3 -->
      <circle cx="14" cy="655" r="9" fill="#004080" />
      <text x="38" y="665" font-family="'Inter', sans-serif" font-size="26" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Sub-second local AI decisions.
      </text>
    </g>

    <!-- Bottom KPI Card -->
    <rect x="85" y="760" width="474" height="135" rx="10" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="322" y="838" text-anchor="middle" font-family="'Inter', sans-serif" font-size="30" font-weight="800" fill="#004080">
      Independent Edge Inference
    </text>
  </g>

  <!-- ==================== CARD 2: MIDDLEWARE MQTT COMM BUS (X=688, Width=544, Center X=960) ==================== -->
  <g id="card-mqtt-bus">
    <rect x="688" y="165" width="544" height="790" rx="12" fill="#F8FAFC" stroke="#006633" stroke-width="2" />

    <!-- Top Category Banner -->
    <rect x="713" y="188" width="494" height="38" rx="6" fill="#006633" />
    <text x="960" y="213" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      COMMUNICATION MIDDLEWARE BUS
    </text>

    <!-- Centered Header -->
    <text x="960" y="285" text-anchor="middle" font-family="'Inter', sans-serif" font-size="40" font-weight="800" fill="#1A1A1A">
      MQTT Comm Bus
    </text>

    <line x1="723" y1="325" x2="1197" y2="325" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Massive Single-Line Bullet Points -->
    <g transform="translate(723, 0)">
      <!-- Bullet 1 -->
      <circle cx="14" cy="415" r="9" fill="#006633" />
      <text x="38" y="425" font-family="'Inter', sans-serif" font-size="25" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Fast, lightweight messaging network.
      </text>

      <!-- Bullet 2 -->
      <circle cx="14" cy="535" r="9" fill="#006633" />
      <text x="38" y="545" font-family="'Inter', sans-serif" font-size="25" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Failsafe message rerouting.
      </text>

      <!-- Bullet 3 -->
      <circle cx="14" cy="655" r="9" fill="#006633" />
      <text x="38" y="665" font-family="'Inter', sans-serif" font-size="25" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Active connection crash detection.
      </text>
    </g>

    <!-- Bottom KPI Card -->
    <rect x="723" y="760" width="474" height="135" rx="10" fill="#FFFFFF" stroke="#006633" stroke-width="2" />
    <text x="960" y="838" text-anchor="middle" font-family="'Inter', sans-serif" font-size="30" font-weight="800" fill="#006633">
      Zero Data Loss Failover
    </text>
  </g>

  <!-- ==================== CARD 3: TIER 2 GLOBAL ORCHESTRATOR (X=1326, Width=544, Center X=1598) ==================== -->
  <g id="card-global-orchestrator">
    <rect x="1326" y="165" width="544" height="790" rx="12" fill="#F8FAFC" stroke="#004080" stroke-width="2" />

    <!-- Top Category Banner -->
    <rect x="1351" y="188" width="494" height="38" rx="6" fill="#004080" />
    <text x="1598" y="213" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      TIER 2 : REGIONAL SUPERVISION
    </text>

    <!-- Centered Header -->
    <text x="1598" y="285" text-anchor="middle" font-family="'Inter', sans-serif" font-size="40" font-weight="800" fill="#1A1A1A">
      Global Orchestrator
    </text>

    <line x1="1361" y1="325" x2="1835" y2="325" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Massive Single-Line Bullet Points -->
    <g transform="translate(1361, 0)">
      <!-- Bullet 1 -->
      <circle cx="14" cy="415" r="9" fill="#004080" />
      <text x="38" y="425" font-family="'Inter', sans-serif" font-size="25" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Multi-camera threat verification.
      </text>

      <!-- Bullet 2 -->
      <circle cx="14" cy="535" r="9" fill="#004080" />
      <text x="38" y="545" font-family="'Inter', sans-serif" font-size="25" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Automated tactical trap planning.
      </text>

      <!-- Bullet 3 -->
      <circle cx="14" cy="655" r="9" fill="#004080" />
      <text x="38" y="665" font-family="'Inter', sans-serif" font-size="25" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        Strict Human-in-the-Loop gateway.
      </text>
    </g>

    <!-- Bottom KPI Card -->
    <rect x="1361" y="760" width="474" height="135" rx="10" fill="#FFFFFF" stroke="#004080" stroke-width="2" />
    <text x="1598" y="838" text-anchor="middle" font-family="'Inter', sans-serif" font-size="30" font-weight="800" fill="#004080">
      Ethical Gate Lock
    </text>
  </g>

  <!-- ==================== BOTTOM SUMMARY BAR ==================== -->
  <g id="bottom-bar">
    <rect x="50" y="975" width="1820" height="75" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <text x="322" y="1022" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#004080">
      ✦ Tier 1: Local Edge Autonomy (Simulation)
    </text>
    <text x="960" y="1022" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#006633">
      ✦ Zero Single Point of Failure (ZSPF)
    </text>
    <text x="1598" y="1022" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#004080">
      ✦ Tier 2: Human-in-the-Loop Gateway
    </text>
  </g>
</svg>
