    </text>

    <line x1="545" y1="325" x2="910" y2="325" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Massive Single-Line Bullet Points -->
    <g transform="translate(538, 0)">
      <!-- Bullet 1 -->
      <circle cx="12" cy="415" r="8" fill="#004080" />
      <text x="32" y="424" font-family="'Inter', sans-serif" font-size="21" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
        AI learns queue clearing tactics.
      </text>

      <!-- Bullet 2 -->
      <circle cx="12" cy="535" r="8" fill="#004080" />
      <text x="32" y="544" font-family="'Inter', sans-serif" font-size="21" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
