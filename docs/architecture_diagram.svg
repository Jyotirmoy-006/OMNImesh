<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Solid Dark Navy Corporate Background -->
  <rect width="1920" height="1080" fill="#0B0F19" />

  <!-- Crisp, Subtle Architectural Grid -->
  <g opacity="0.08" stroke="#334155" stroke-width="1">
    <line x1="0" y1="120" x2="1920" y2="120" />
    <line x1="0" y1="240" x2="1920" y2="240" />
    <line x1="0" y1="360" x2="1920" y2="360" />
    <line x1="0" y1="480" x2="1920" y2="480" />
    <line x1="0" y1="600" x2="1920" y2="600" />
    <line x1="0" y1="720" x2="1920" y2="720" />
    <line x1="0" y1="840" x2="1920" y2="840" />
    <line x1="0" y1="960" x2="1920" y2="960" />
    <line x1="240" y1="0" x2="240" y2="1080" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="720" y1="0" x2="720" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" />
    <line x1="1200" y1="0" x2="1200" y2="1080" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
    <line x1="1680" y1="0" x2="1680" y2="1080" />
  </g>

  <!-- Markers for Clean Data Flow Arrows -->
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#10B981" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#F43F5E" />
    </marker>
    <marker id="arrow-cyan-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 2 L 2 5 L 9 8 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-emerald-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 2 L 2 5 L 9 8 z" fill="#10B981" />
    </marker>
    <marker id="arrow-rose-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 2 L 2 5 L 9 8 z" fill="#F43F5E" />
    </marker>
  </defs>

  <!-- ==================== TOP HEADER ==================== -->
  <g id="slide-header">
    <text x="960" y="85" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">
      OMNI-MESH SYSTEM ARCHITECTURE
    </text>
    <text x="960" y="130" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
      Three-Tier Decentralized Edge Architecture &amp; Data Flow Overview
    </text>
  </g>

  <!-- ==================== DATA FLOW CONNECTORS (WIDE 170px GAPS) ==================== -->
  <!-- Gap 1: Edge Mesh <-> MQTT Comm Bus (X=550 to X=720, Width=170) -->
  <g id="connector-edge-bus">
    <!-- Top Flow: States (Edge -> Bus) -->
    <path d="M 565 470 L 705 470" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
    <rect x="585" y="425" width="100" height="32" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1" />
    <text x="635" y="447" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#38BDF8">
      States ▶
    </text>

    <!-- Bottom Flow: Sync / Directives (Bus -> Edge) -->
    <path d="M 705 670 L 565 670" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-emerald-rev)" />
    <rect x="585" y="685" width="100" height="32" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1" />
    <text x="635" y="707" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#10B981">
      ◀ Sync
    </text>
  </g>

  <!-- Gap 2: MQTT Comm Bus <-> Global Orchestrator (X=1200 to X=1370, Width=170) -->
  <g id="connector-bus-orch">
    <!-- Top Flow: Alerts (Bus -> Orchestrator) -->
    <path d="M 1215 470 L 1355 470" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
    <rect x="1235" y="425" width="100" height="32" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1" />
    <text x="1285" y="447" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#38BDF8">
      Alerts ▶
    </text>

    <!-- Bottom Flow: Overrides (Orchestrator -> Bus) -->
    <path d="M 1355 670 L 1215 670" stroke="#F43F5E" stroke-width="2.5" marker-end="url(#arrow-rose-rev)" />
    <rect x="1230" y="685" width="110" height="32" rx="6" fill="#111C2E" stroke="#1E293B" stroke-width="1" />
    <text x="1285" y="707" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#FB7185">
      ◀ Override
    </text>
  </g>

  <!-- ==================== CARD 1: EDGE MESH ==================== -->
  <g id="card-edge-mesh">
    <!-- Clean Dark-Mode Glassmorphic Card (Subtle 1px border, generous height) -->
    <rect x="70" y="180" width="480" height="750" rx="16" fill="#0F172A" stroke="#25354C" stroke-width="1" />

    <!-- Top Badge -->
    <rect x="105" y="215" width="200" height="32" rx="6" fill="#17253D" stroke="#2563EB" stroke-width="1" />
    <text x="205" y="237" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#60A5FA" letter-spacing="1">
      TIER 1 : EDGE MESH
    </text>

    <!-- Single-Line Card Header (Font 24px) -->
    <text x="105" y="290" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">
      Edge Mesh (RPi 4B Agents)
    </text>
    <text x="105" y="322" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#94A3B8">
      Autonomous Intersection Controller
    </text>

    <!-- Subtle 1px Divider -->
    <line x1="105" y1="350" x2="515" y2="350" stroke="#1E293B" stroke-width="1" />

    <!-- Core Pillars (Clean, Spacious) -->
    <g transform="translate(105, 390)">
      <circle cx="6" cy="6" r="4" fill="#38BDF8" />
      <text x="24" y="12" font-family="'Inter', sans-serif" font-size="19" font-weight="500" fill="#E2E8F0">
        Decentralized Signal Phase Optimization
      </text>

      <circle cx="6" cy="66" r="4" fill="#38BDF8" />
      <text x="24" y="72" font-family="'Inter', sans-serif" font-size="19" font-weight="500" fill="#E2E8F0">
        Real-Time Vision &amp; ANPR Perception Loop
      </text>

      <circle cx="6" cy="126" r="4" fill="#38BDF8" />
      <text x="24" y="132" font-family="'Inter', sans-serif" font-size="19" font-weight="500" fill="#E2E8F0">
        Multi-Agent P2P State Sharing Protocol
      </text>

      <circle cx="6" cy="186" r="4" fill="#38BDF8" />
      <text x="24" y="192" font-family="'Inter', sans-serif" font-size="19" font-weight="500" fill="#E2E8F0">
        Mode 2 Island Fail-Safe Execution
      </text>
    </g>

    <!-- Bottom Status / KPI Chip -->
    <rect x="105" y="690" width="410" height="90" rx="12" fill="#132034" stroke="#1E3352" stroke-width="1" />
    <text x="310" y="730" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#38BDF8">
      Sub-100ms Inference Latency
    </text>
    <text x="310" y="758" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#94A3B8">
      Deterministic Local RL Control Loop
    </text>
  </g>

  <!-- ==================== CARD 2: MQTT COMM BUS ==================== -->
  <g id="card-mqtt-bus">
    <!-- Clean Dark-Mode Glassmorphic Card -->
    <rect x="720" y="180" width="480" height="750" rx="16" fill="#0F172A" stroke="#1F3A34" stroke-width="1" />

    <!-- Top Badge -->
    <rect x="755" y="215" width="220" height="32" rx="6" fill="#0B2620" stroke="#059669" stroke-width="1" />
    <text x="865" y="237" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#34D399" letter-spacing="1">
      COMMS MIDDLEWARE
    </text>

    <!-- Single-Line Card Header (Font 24px) -->
    <text x="755" y="290" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">
      MQTT Communication Bus
    </text>
    <text x="755" y="322" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#94A3B8">
      Low-Latency Pub/Sub Topology
    </text>

    <!-- Subtle 1px Divider -->
    <line x1="755" y1="350" x2="1165" y2="350" stroke="#1E293B" stroke-width="1" />

    <!-- Core Pillars (Clean, Spacious) -->
    <g transform="translate(755, 390)">
      <circle cx="6" cy="6" r="4" fill="#34D399" />
      <text x="24" y="12" font-family="'Inter', sans-serif" font-size="19" font-weight="500" fill="#E2E8F0">
        Lightweight Asynchronous MQTT Broker
      </text>

      <circle cx="6" cy="66" r="4" fill="#34D399" />
      <text x="24" y="72" font-family="'Inter', sans-serif" font-size="19" font-weight="500" fill="#E2E8F0">
        MessagePack Binary State Serialization
      </text>

      <circle cx="6" cy="126" r="4" fill="#34D399" />
      <text x="24" y="132" font-family="'Inter', sans-serif" font-size="19" font-weight="500" fill="#E2E8F0">
        Active ZSPF Liveness Heartbeat Monitor
      </text>

      <circle cx="6" cy="186" r="4" fill="#34D399" />
      <text x="24" y="192" font-family="'Inter', sans-serif" font-size="19" font-weight="500" fill="#E2E8F0">
        Sub-100 Byte Minimal Packet Footprint
      </text>
    </g>

    <!-- Bottom Status / KPI Chip -->
    <rect x="755" y="690" width="410" height="90" rx="12" fill="#0E2721" stroke="#144C3F" stroke-width="1" />
    <text x="960" y="730" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#34D399">
      Zero Single Point of Failure
    </text>
    <text x="960" y="758" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#94A3B8">
      Instant Autonomous Island Degradation
    </text>
  </g>

  <!-- ==================== CARD 3: GLOBAL ORCHESTRATOR ==================== -->
  <g id="card-global-orchestrator">
    <!-- Clean Dark-Mode Glassmorphic Card -->
    <rect x="1370" y="180" width="480" height="750" rx="16" fill="#0F172A" stroke="#362952" stroke-width="1" />

    <!-- Top Badge -->
    <rect x="1405" y="215" width="220" height="32" rx="6" fill="#251642" stroke="#7C3AED" stroke-width="1" />
    <text x="1515" y="237" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#C084FC" letter-spacing="1">
      TIER 2 : SUPERVISION
    </text>

    <!-- Single-Line Card Header (Font 24px) -->
    <text x="1405" y="290" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">
      Global Zone Orchestrator
    </text>
    <text x="1405" y="322" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#94A3B8">
      Centralized Policy &amp; Watchlist Oversight
    </text>

    <!-- Subtle 1px Divider -->
    <line x1="1405" y1="350" x2="1815" y2="350" stroke="#1E293B" stroke-width="1" />

    <!-- Core Pillars (Clean, Spacious) -->
    <g transform="translate(1405, 390)">
      <circle cx="6" cy="6" r="4" fill="#C084FC" />
      <text x="24" y="12" font-family="'Inter', sans-serif" font-size="19" font-weight="500" fill="#E2E8F0">
        Multi-Node Temporal Consensus Filter
      </text>

      <circle cx="6" cy="66" r="4" fill="#C084FC" />
      <text x="24" y="72" font-family="'Inter', sans-serif" font-size="19" font-weight="500" fill="#E2E8F0">
        Priority Security Corridor Preemption
      </text>

      <circle cx="6" cy="126" r="4" fill="#C084FC" />
      <text x="24" y="132" font-family="'Inter', sans-serif" font-size="19" font-weight="500" fill="#E2E8F0">
        Ethical Authorization State Lock
      </text>

      <circle cx="6" cy="186" r="4" fill="#C084FC" />
      <text x="24" y="192" font-family="'Inter', sans-serif" font-size="19" font-weight="500" fill="#E2E8F0">
        REST &amp; WebSocket Dispatcher Interface
      </text>
    </g>

    <!-- Bottom Status / KPI Chip -->
    <rect x="1405" y="690" width="410" height="90" rx="12" fill="#24163E" stroke="#44256E" stroke-width="1" />
    <text x="1610" y="730" text-anchor="middle" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#C084FC">
      Human-in-the-Loop Gateway
    </text>
    <text x="1610" y="758" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#94A3B8">
      Mandatory Dispatcher Verification
    </text>
  </g>

  <!-- ==================== BOTTOM SUMMARY BAR ==================== -->
  <g id="bottom-bar">
    <rect x="70" y="960" width="1780" height="75" rx="12" fill="#0E1626" stroke="#1E293B" stroke-width="1" />
    <text x="350" y="1006" text-anchor="middle" font-family="'Inter', sans-serif" font-size="19" font-weight="600" fill="#38BDF8">
      ✦ Edge Autonomy (RPi 4B Cluster)
    </text>
    <text x="960" y="1006" text-anchor="middle" font-family="'Inter', sans-serif" font-size="19" font-weight="600" fill="#34D399">
      ✦ Zero Single Point of Failure (ZSPF)
    </text>
    <text x="1570" y="1006" text-anchor="middle" font-family="'Inter', sans-serif" font-size="19" font-weight="600" fill="#C084FC">
      ✦ Human-in-the-Loop Ethical Authorization
    </text>
  </g>
</svg>
